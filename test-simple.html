<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .box {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { margin: 0 0 20px 0; }
        .success { color: #4CAF50; font-size: 48px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="success">✓</div>
        <h1>Serveur Vite fonctionne !</h1>
        <p>Si vous voyez cette page, votre serveur de développement fonctionne correctement.</p>
        <p><strong>URL:</strong> <a href="http://localhost:3000">http://localhost:3000</a></p>
        <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
        <p style="font-size: 14px; color: #666;">
            Pour voir votre application React, ouvrez <strong>http://localhost:3000</strong> dans votre navigateur.
        </p>
    </div>
</body>
</html>
